name: survivor_test
description: "Vegetable Survivors - a top-down survivor game."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The version players see (1.0.0) and the build number after the +.
# The build number must go up with every upload to the Play Store.
version: 1.0.0+1

environment:
  sdk: ^3.10.4
  flutter: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.33.0
  flame_tiled: ^3.0.9
  flutter_soloud: ^3.4.10
  shared_preferences: ^2.5.5
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0

flutter:
  # Packs Flutter's built-in icons (like the edit pencil) into the app
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/HUD/
    - assets/images/Items/Fruits/
    - assets/images/Terrain/
    - assets/images/Terrain/summer/
    - assets/images/Terrain/winter/
    - assets/images/Terrain/autumn/
    - assets/images/Traps/Saw/
    - assets/audio/
    - assets/tiles/

dev_dependencies:
  # Only used on the computer: creates the app icon in all sizes
  flutter_launcher_icons: ^0.14.4

# Settings for the app icon. After replacing assets/icon/icon.png, run
#     dart run flutter_launcher_icons
# PLACEHOLDER: assets/icon/icon.png is a stand-in until the real icon exists
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
